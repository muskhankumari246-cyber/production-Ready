<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Internship Portal Dashboard</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #f8fafc; color: #1e293b; padding: 30px; }
        .container { max-width: 950px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 30px; }
        header h1 { color: #0f172a; font-size: 28px; }
        header p { color: #64748b; font-size: 14px; margin-top: 5px; }
        
        .form-box { background: white; padding: 25px; border-radius: 12px; margin-bottom: 30px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); border: 1px solid #e2e8f0; }
        .form-box h3 { margin-bottom: 15px; color: #334155; font-size: 18px; }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
        .form-box input { width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; outline: none; transition: border 0.2s; }
        .form-box input:focus { border-color: #6366f1; }
        .form-box button { grid-column: 1 / -1; background: #4f46e5; color: white; border: none; padding: 12px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 15px; transition: background 0.2s; }
        .form-box button:hover { background: #4338ca; }

        .status-box { text-align: center; padding: 20px; font-size: 15px; color: #64748b; grid-column: 1 / -1; }
        .error-state { color: #dc2626; background: #fee2e2; padding: 12px; border-radius: 8px; border: 1px solid #fca5a5; }

        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
        .card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); border: 1px solid #e2e8f0; transition: transform 0.2s; }
        .card:hover { transform: translateY(-3px); }
        .card-title { font-size: 18px; font-weight: 700; color: #0f172a; margin-bottom: 4px; }
        .card-company { font-size: 14px; color: #6366f1; font-weight: 600; margin-bottom: 12px; }
        .badge { display: inline-block; background: #e0e7ff; color: #4338ca; font-size: 12px; padding: 4px 10px; border-radius: 20px; font-weight: 600; margin-bottom: 12px; }
        .info { font-size: 13px; color: #475569; margin-top: 6px; }
        .stipend { font-weight: 700; color: #16a34a; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Secure Internship Dashboard</h1>
            <p>Milestone 4: Secure Application Integration & Server-Side Validation</p>
        </header>

        <!-- Secure Form with Client-Side Validation -->
        <div class="form-box">
            <h3>Add New Internship Application</h3>
            <form id="addForm" onsubmit="addInternship(event)">
                <div class="form-grid">
                    <input type="text" id="title" placeholder="Job Title (e.g. Frontend Dev)" required minlength="2">
                    <input type="text" id="company" placeholder="Company Name" required minlength="2">
                    <input type="text" id="domain" placeholder="Domain" required>
                    <input type="text" id="location" placeholder="Location (e.g. Remote)" required>
                    <input type="text" id="stipend" placeholder="Stipend (e.g. ₹10,000 / month)" required>
                </div>
                <button type="submit" style="margin-top: 15px;">Securely Store in Database</button>
            </form>
        </div>

        <!-- Dynamic Output Grid with Loading and Error States -->
        <div id="cards-container" class="grid">
            <div class="status-box">Loading secure records...</div>
        </div>
    </div>

    <script>
        async function fetchInternships() {
            const container = document.getElementById('cards-container');
            try {
                container.innerHTML = '<div class="status-box">Fetching data from secure API...</div>';
                const res = await fetch('/api/internships');
                
                if (!res.ok) throw new Error('Failed to fetch data from server.');
                
                const result = await res.json();
                const data = result.data || result;

                container.innerHTML = '';

                if (data.length === 0) {
                    container.innerHTML = '<div class="status-box">No internships available.</div>';
                    return;
                }

                data.forEach(item => {
                    container.innerHTML += `
                        <div class="card">
                            <div class="card-title">${item.title}</div>
                            <div class="card-company">${item.company}</div>
                            <div><span class="badge">${item.domain}</span></div>
                            <div class="info">Location: <b>${item.location}</b></div>
                            <div class="info">Stipend: <span class="stipend">${item.stipend}</span></div>
                        </div>
                    `;
                });
            } catch (err) {
                container.innerHTML = `<div class="status-box error-state"><b>Error:</b> Could not load data from API. Please verify server status.</div>`;
            }
        }

        async function addInternship(e) {
            e.preventDefault();
            const newInternship = {
                title: document.getElementById('title').value,
                company: document.getElementById('company').value,
                domain: document.getElementById('domain').value,
                location: document.getElementById('location').value,
                stipend: document.getElementById('stipend').value
            };

            try {
                const res = await fetch('/api/internships', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(newInternship)
                });

                const result = await res.json();
                if (res.ok && result.success) {
                    document.getElementById('addForm').reset();
                    fetchInternships();
                } else {
                    alert('Validation error: ' + (result.errors ? result.errors[0].msg : 'Failed to save'));
                }
            } catch (err) {
                alert('Network error while saving data.');
            }
        }

        fetchInternships();
    </script>
</body>
</html>
